<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b2f" />
      <stop offset="50%" stop-color="#0a2540" />
      <stop offset="100%" stop-color="#061524" />
    </linearGradient>

    <!-- Droplet Glow & Wave Gradients -->
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="contourGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="contourGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Radial Core Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#00f2fe" flood-opacity="0.25" />
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect x="6" y="6" width="188" height="188" rx="44" fill="url(#bgGrad)" stroke="#1e3a5f" stroke-width="2" />

  <!-- Background Topographic Catchment Contour Lines (Subtle) -->
  <g opacity="0.18" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round">
    <path d="M 24 140 C 50 110, 80 135, 110 120 C 140 105, 160 125, 176 115" />
    <path d="M 20 160 C 60 135, 95 160, 130 145 C 155 135, 170 150, 180 140" />
    <path d="M 30 180 C 70 160, 110 175, 145 165 C 165 158, 175 165, 184 160" />
  </g>

  <!-- Central Emblem: The 3D Bulos Water Droplet & Watershed Wave Flow -->
  <g filter="url(#shadow)">
    <!-- Main Outer Droplet Contour -->
    <path d="M 100 28 
             C 82 52, 48 98, 48 132 
             A 52 52 0 0 0 152 132 
             C 152 98, 118 52, 100 28 Z" 
          fill="none" 
          stroke="url(#contourGrad1)" 
          stroke-width="5" 
          stroke-linejoin="round" />

    <!-- Inner Catchment Elevation Ridge 1 (Isarog Contour) -->
    <path d="M 64 122
             C 80 110, 100 128, 118 116
             C 128 109, 136 114, 142 124" 
          fill="none" 
          stroke="url(#contourGrad2)" 
          stroke-width="4" 
          stroke-linecap="round" />

    <!-- Inner Catchment Elevation Ridge 2 (Stream Torrent / Bulos Flow) -->
    <path d="M 58 142
             C 75 130, 95 146, 115 136
             C 130 128, 138 134, 146 140" 
          fill="none" 
          stroke="url(#contourGrad1)" 
          stroke-width="4.5" 
          stroke-linecap="round" />

    <!-- Lower River Discharge Curve -->
    <path d="M 68 160
             C 85 152, 102 162, 118 156
             C 126 152, 132 154, 138 158" 
          fill="none" 
          stroke="#38bdf8" 
          stroke-width="3" 
          stroke-linecap="round" 
          opacity="0.85" />
  </g>

  <!-- Digital Twin Telemetry Node & Ray Pulses (Center) -->
  <g>
    <!-- Outer Ping Wave -->
    <circle cx="100" cy="88" r="14" fill="none" stroke="#00f2fe" stroke-width="1.5" opacity="0.4" />
    <circle cx="100" cy="88" r="22" fill="none" stroke="#00f2fe" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.3" />

    <!-- Telemetry Core Node -->
    <circle cx="100" cy="88" r="7" fill="url(#coreGlow)" />
    <circle cx="100" cy="88" r="3.5" fill="#ffffff" />
  </g>

  <!-- Accent Sensor Beacons (LoRaWAN Nodes) -->
  <circle cx="68" cy="122" r="3" fill="#34d399" filter="url(#subtleGlow)" />
  <circle cx="132" cy="136" r="3" fill="#38bdf8" filter="url(#subtleGlow)" />
  <circle cx="118" cy="156" r="2.5" fill="#34d399" filter="url(#subtleGlow)" />

  <!-- Connecting Telemetry Vectors -->
  <line x1="100" y1="88" x2="68" y2="122" stroke="#34d399" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.6" />
  <line x1="100" y1="88" x2="132" y2="136" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.6" />
</svg>
