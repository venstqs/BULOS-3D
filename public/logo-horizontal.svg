<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b2f" />
      <stop offset="100%" stop-color="#0a2540" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
  </defs>

  <!-- Left Emblem (Compact 100x100 scaled inside 110x110) -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="100" height="100" rx="26" fill="url(#iconBg)" stroke="#1e3a5f" stroke-width="1.5" />
    
    <!-- Droplet Outline -->
    <path d="M 50 16 
             C 41 28, 24 51, 24 68 
             A 26 26 0 0 0 76 68 
             C 76 51, 59 28, 50 16 Z" 
          fill="none" 
          stroke="url(#waveGrad)" 
          stroke-width="3" 
          stroke-linejoin="round" />

    <!-- Wave Contours -->
    <path d="M 32 63 C 40 57, 50 66, 59 60 C 64 57, 68 59, 71 64" fill="none" stroke="url(#waveGrad)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 29 73 C 38 67, 48 75, 58 70 C 65 66, 69 69, 73 72" fill="none" stroke="url(#waveGrad)" stroke-width="2.5" stroke-linecap="round" />

    <!-- Telemetry Core Pulse -->
    <circle cx="50" cy="46" r="4" fill="#ffffff" />
    <circle cx="50" cy="46" r="8" fill="none" stroke="#00f2fe" stroke-width="1" opacity="0.6" />
    <circle cx="35" cy="63" r="2" fill="#34d399" />
    <circle cx="66" cy="70" r="2" fill="#38bdf8" />
  </g>

  <!-- Typography Right Lockup -->
  <g transform="translate(130, 22)">
    <!-- Wordmark -->
    <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" font-size="40" font-weight="900" letter-spacing="-0.5" fill="#0f172a">
      BULOS <tspan fill="#0284c7">3D</tspan>
    </text>

    <!-- Project Subtitle / Category -->
    <text x="2" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="2.2" fill="#64748b">
      WATER QUALITY DIGITAL TWIN
    </text>

    <!-- Event & School Affiliation Pill -->
    <g transform="translate(2, 77)">
      <rect x="0" y="0" width="280" height="18" rx="9" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" />
      <text x="10" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#0369a1">
        XYLEM INNOVATION CHALLENGE · CSNHS
      </text>
    </g>
  </g>
</svg>
